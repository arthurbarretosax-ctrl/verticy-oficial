<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
  <title>Editor Arquiteto · Verticy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/verticy.css?v=3" />
  <style>
    .ed-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .ed-nav button { padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: var(--muted, #8892a6); font-size: 13px; cursor: pointer; transition: all .2s; }
    .ed-nav button.active { background: var(--brand, #7c5cff); border-color: transparent; color: #fff; }
    .ed-section { display: none; }
    .ed-section.active { display: block; }
    .ed-repeat { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: rgba(255,255,255,.02); }
    .ed-repeat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ed-repeat-head strong { font-size: 13px; }
    .textarea-sm { min-height: 70px; }

    /* Upload widget */
    .ed-img { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; margin-bottom: 14px; background: rgba(255,255,255,.02); }
    .ed-img-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .ed-img-head label { font-size: 13px; font-weight: 500; color: #cfd3df; }
    .ed-img-hint { font-size: 11px; color: var(--muted, #8892a6); letter-spacing: 0.02em; }
    .ed-img-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
    .ed-img-thumb { width: 96px; height: 96px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.3) center/cover no-repeat; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #4a4f5c; font-size: 22px; }
    .ed-img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ed-img-actions { display: flex; flex-direction: column; gap: 8px; }
    .ed-img-actions .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .ed-img input[type="file"] { display: none; }
    .ed-img .btn-file { position: relative; overflow: hidden; }
    .ed-img .btn-file.uploading { opacity: 0.6; pointer-events: none; }
    .ed-img .input-sm { padding: 8px 10px; font-size: 12px; }

    /* Color pickers */
    .ed-color { display: grid; grid-template-columns: 56px 1fr 110px; gap: 12px; align-items: center; padding: 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(255,255,255,.02); margin-bottom: 10px; }
    .ed-color input[type="color"] { width: 56px; height: 40px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: transparent; padding: 2px; cursor: pointer; }
    .ed-color .meta { display: flex; flex-direction: column; gap: 2px; }
    .ed-color .meta strong { font-size: 13px; color: #dfe3ec; font-weight: 500; }
    .ed-color .meta small { font-size: 11px; color: var(--muted, #8892a6); }
    .ed-color input[type="text"] { padding: 8px 10px; font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .ed-color-reset { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="editor-shell">
    <header class="editor-toolbar">
      <a href="/painel.html" class="brand" style="font-size:15px"><span class="brand-mark"></span><span>Editor · Arquiteto</span></a>
      <div class="flex gap-2 items-center">
        <span class="tag" id="save-state">Tudo salvo</span>
        <a class="btn btn-ghost btn-sm" id="preview-link" target="_blank" rel="noopener">Ver site</a>
        <button class="btn btn-primary btn-sm" id="save-btn">Salvar</button>
      </div>
    </header>

    <div class="editor-main">
      <aside class="editor-panel">
        <div class="ed-nav" id="ed-nav"></div>
        <div id="ed-body"></div>
      </aside>
      <main class="editor-preview">
        <div class="device-mockup">
          <div class="device-notch"></div>
          <iframe id="live-preview-frame" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { supabase, requireProfile, toast, uploadSiteImage } from "/assets/js/verticy.js";
    import { BUFFET01_DEFAULTS } from "/assets/js/buffet01-defaults.js";

    const ctx = await requireProfile();
    if (!ctx) throw new Error("no session");
    const { session, profile } = ctx;
    if (!profile?.onboarding_completed) window.location.replace("/onboarding.html");

    document.getElementById("preview-link").href = `${window.location.origin}/${profile.username}`;
    const livePreviewFrame = document.getElementById("live-preview-frame");
    if (livePreviewFrame) livePreviewFrame.src = `${window.location.origin}/${profile.username}?preview=true`;

    const urlParams = new URLSearchParams(window.location.search);
    const siteIdParam = urlParams.get('site');
    let siteQuery = supabase.from("sites").select("*").eq("user_id", session.user.id);
    if (siteIdParam) {
      siteQuery = siteQuery.eq("id", siteIdParam).maybeSingle();
    } else {
      siteQuery = siteQuery.order("updated_at", { ascending: false }).limit(1).maybeSingle();
    }
    const { data: site } = await siteQuery;
    if (!site) { toast("Site não encontrado", "error"); throw new Error("no site"); }
    if (site.template_id !== "buffet01") {
      window.location.replace("/editor.html");
      throw new Error("wrong template");
    }

    function merge(base, add) {
      if (Array.isArray(base)) return add !== undefined ? add : base;
      if (typeof base === "object" && base !== null) {
        const out = { ...base };
        for (const k of Object.keys(base)) if (add && add[k] !== undefined) out[k] = merge(base[k], add[k]);
        if (add) for (const k of Object.keys(add)) if (!(k in base)) out[k] = add[k];
        return out;
      }
      return add !== undefined ? add : base;
    }
    let content = merge(BUFFET01_DEFAULTS, site.content || {});

    const saveState = document.getElementById("save-state");
    let dirty = false;
    const markDirty = () => { 
      dirty = true; saveState.textContent = "Alterações pendentes"; saveState.className = "tag"; 
      if (livePreviewFrame && livePreviewFrame.contentWindow) {
        livePreviewFrame.contentWindow.postMessage({ type: "LIVE_PREVIEW", content }, "*");
      }
    };
    const markClean = () => { dirty = false; saveState.textContent = "Tudo salvo"; saveState.className = "tag success"; };

    const SECTIONS = [
      { id: "theme", label: "Cores" },
      { id: "branding", label: "Marca" },
      { id: "hero", label: "Capa (Hero)" },
      { id: "action", label: "Chamada à Ação" },
      { id: "areas", label: "Áreas de Atuação" },
      { id: "marquee", label: "Letreiro (Marquee)" },
      { id: "about", label: "Sobre" },
      { id: "articles", label: "Artigos & Dicas" },
      { id: "lifestyle", label: "Lifestyle (Fotos)" },
      { id: "contact", label: "Contato & Rodapé" },
    ];

    const nav = document.getElementById("ed-nav");
    SECTIONS.forEach((s, i) => {
      const b = document.createElement("button");
      b.textContent = s.label;
      b.dataset.tab = s.id;
      if (i === 0) b.classList.add("active");
      b.addEventListener("click", () => showTab(s.id));
      nav.appendChild(b);
    });

    const body = document.getElementById("ed-body");
    function esc(s) { return String(s ?? "").replace(/"/g, "&quot;"); }
    function txt(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

    function field(label, key, val, opts = {}) {
      const t = opts.type || "text";
      if (t === "textarea") {
        return `<div class="field"><label>${label}</label><textarea class="textarea ${opts.small ? "textarea-sm" : ""}" data-key="${key}">${txt(val)}</textarea></div>`;
      }
      if (t === "checkbox") {
        return `<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-key="${key}" ${val ? "checked" : ""}/> ${label}</label></div>`;
      }
      return `<div class="field"><label>${label}</label><input class="input" type="${t}" data-key="${key}" value="${esc(val)}" placeholder="${esc(opts.ph||"")}" /></div>`;
    }

    function imgField(label, key, val, opts = {}) {
      const suggested = opts.suggested || "";
      const preview = val ? `<img src="${esc(val)}" alt=""/>` : "🖼";
      return `
        <div class="ed-img">
          <div class="ed-img-head">
            <label>${label}</label>
            ${suggested ? `<span class="ed-img-hint">Sugerido: ${esc(suggested)}</span>` : ""}
          </div>
          <div class="ed-img-row">
            <div class="ed-img-thumb" data-thumb="${key}">${preview}</div>
            <div class="ed-img-actions">
              <div class="row">
                <label class="btn btn-primary btn-sm btn-file" data-upload-key="${key}">
                  <input type="file" accept="image/*" />
                  Escolher do dispositivo
                </label>
                <button class="btn btn-ghost btn-sm" type="button" data-clear-key="${key}">Remover</button>
              </div>
              <input class="input input-sm" type="url" data-key="${key}" value="${esc(val)}" placeholder="ou cole uma URL" />
            </div>
          </div>
        </div>
      `;
    }

    function colorField(label, hint, key, val) {
      return `
        <div class="ed-color" data-color-row="${key}">
          <input type="color" data-color-key="${key}" value="${esc(val || "#000000")}"/>
          <div class="meta"><strong>${label}</strong><small>${esc(hint)}</small></div>
          <input type="text" class="input input-sm" data-key="${key}" value="${esc(val)}" placeholder="#000000"/>
        </div>`;
    }

    const renderers = {
      theme: () => {
        const c = content.theme.colors;
        return `
          <div class="block-label">Cores do site</div>
          <p class="muted" style="font-size:12px;margin-bottom:14px">Personalize a paleta exclusiva. Ideal manter os tons de classe do Direito.</p>
          ${colorField("Fundo (bg)", "Fundo geral", "theme.colors.bg", c.bg)}
          ${colorField("Escuro (dark)", "Partes escuras", "theme.colors.dark", c.dark)}
          ${colorField("Verde Claro (greenLight)", "Tons esverdeados", "theme.colors.greenLight", c.greenLight)}
          ${colorField("Areia (sand)", "Detalhes", "theme.colors.sand", c.sand)}
          ${colorField("Dourado (gold)", "Textos em destaque", "theme.colors.gold", c.gold)}
          ${colorField("Texto (text)", "Cor primária de fonte", "theme.colors.text", c.text)}
          <button class="btn btn-ghost btn-sm ed-color-reset" id="reset-colors" type="button">Restaurar paleta original</button>
        `;
      },
      branding: () => {
        const b = content.branding;
        return `
          <div class="block-label">Sua Marca</div>
          ${field("Nome do Advogado(a) ou Escritório", "branding.name", b.name)}
          ${field("Descrição Curta", "branding.tagline", b.tagline)}
          ${imgField("Sua Logo (Opcional)", "branding.logo_url", b.logo_url, { suggested: "PNG transparente" })}
        `;
      },
      hero: () => {
        const h = content.hero;
        return `
          <div class="block-label">Apresentação Principal (Capa)</div>
          ${field("Tag/Categoria", "hero.tag", h.tag)}
          ${field("Pequeno Título (Eyebrow)", "hero.eyebrow", h.eyebrow)}
          ${field("Título Gigante - Linha 1", "hero.title_part1", h.title_part1)}
          ${field("Título Gigante - Linha 2", "hero.title_part2", h.title_part2)}
          ${field("Citação de Impacto", "hero.quote", h.quote, { type: "textarea", small: true })}
          ${imgField("Foto Principal (Capa)", "hero.image_url", h.image_url, { suggested: "Foto profissional 1:1 transparente" })}
        `;
      },
      action: () => {
        const a = content.action;
        return `
          <div class="block-label">Chamada à Ação</div>
          ${field("Título de Ação (1)", "action.title_pre", a.title_pre)}
          ${field("Destaque na Ação (2)", "action.title_highlight", a.title_highlight)}
          ${field("Descrição persuasiva", "action.desc", a.desc, { type: "textarea" })}
          ${field("Texto do Botão", "action.btn_label", a.btn_label)}
        `;
      },
      areas: () => {
        const a = content.areas;
        const items = (a.items || []).map((it, i) => `
          <div class="ed-repeat">
            <div class="ed-repeat-head"><strong>Área ${i + 1}</strong> <button class="btn btn-ghost btn-sm" data-remove-area="${i}">Remover</button></div>
            ${field("Título", `areas.items.${i}.title`, it.title, { type: "textarea", small: true })}
            ${field("Descrição", `areas.items.${i}.desc`, it.desc)}
            ${field("Ícone Lucide", `areas.items.${i}.icon`, it.icon)}
            ${field("Em destaque (maior)", `areas.items.${i}.large`, it.large, { type: "checkbox" })}
          </div>
        `).join("");
        return `
          <div class="block-label">Áreas de Atuação</div>
          ${field("Chamada (Eyebrow)", "areas.eyebrow", a.eyebrow)}
          <div class="mt-4">${items}</div>
          <button class="btn btn-ghost btn-sm btn-block mt-2" id="add-area">+ Adicionar Área</button>
        `;
      },
      marquee: () => {
        const m = content.marquee;
        const words = (m.words || []).map((w, i) => `
          <div class="ed-repeat" style="padding:10px 16px; margin-bottom:8px">
            <div style="display:flex; gap:10px; align-items:center;">
              <input class="input" value="${esc(w.text)}" data-key="marquee.words.${i}.text" style="flex:1" />
              <label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" data-key="marquee.words.${i}.italic" ${w.italic ? "checked" : ""}/> Itálico</label>
              <button class="btn btn-ghost btn-sm" data-remove-marquee="${i}">X</button>
            </div>
          </div>
        `).join("");
        return `
          <div class="block-label">Letreiro Dinâmico</div>
          <p class="muted mb-4" style="font-size:13px">Palavras que passam correndo na tela</p>
          ${words}
          <button class="btn btn-ghost btn-sm btn-block mt-2" id="add-marquee">+ Adicionar Palavra</button>
        `;
      },
      about: () => {
        const a = content.about;
        const paras = (a.paragraphs || []).map((p, i) => `
          <div class="ed-repeat" style="padding:10px 16px; margin-bottom:8px">
            <div class="ed-repeat-head"><strong>Parágrafo ${i + 1}</strong> <button class="btn btn-ghost btn-sm" data-remove-about-p="${i}">Remover</button></div>
            <textarea class="textarea textarea-sm" data-key="about.paragraphs.${i}">${txt(p)}</textarea>
          </div>
        `).join("");
        const bullets = (a.bullets || []).map((b, i) => `
          <div style="display:flex; gap:10px; margin-bottom:8px">
            <input class="input" value="${esc(b)}" data-key="about.bullets.${i}" />
            <button class="btn btn-ghost btn-sm" data-remove-about-b="${i}">X</button>
          </div>
        `).join("");
        return `
          <div class="block-label">Sobre Você</div>
          ${field("Citação/Impacto", "about.quote", a.quote)}
          ${imgField("Foto de Perfil/Imprensa", "about.image_url", a.image_url, { suggested: "Retrato escuro 800x800" })}
          
          <div class="mt-4"><h3 class="h-3 mb-2">Parágrafos de Texto</h3>${paras}
            <button class="btn btn-ghost btn-sm btn-block" id="add-about-p">+ Parágrafo</button>
          </div>

          <div class="mt-4"><h3 class="h-3 mb-2">Bullets (Destaques)</h3>${bullets}
            <button class="btn btn-ghost btn-sm btn-block" id="add-about-b">+ Bullet</button>
          </div>
        `;
      },
      articles: () => {
        const a = content.articles;
        const items = (a.items || []).map((it, i) => `
          <div class="ed-repeat">
            <div class="ed-repeat-head"><strong>Artigo ${i + 1}</strong> <button class="btn btn-ghost btn-sm" data-remove-article="${i}">Remover</button></div>
            ${field("Título do Artigo", `articles.items.${i}.title`, it.title)}
            ${field("Tag/Categoria", `articles.items.${i}.tag`, it.tag)}
            ${field("Link URL", `articles.items.${i}.url`, it.url)}
            ${imgField("Imagem da Capa", `articles.items.${i}.image_url`, it.image_url)}
          </div>
        `).join("");
        return `
          <div class="block-label">Artigos & Dicas Jurídicas</div>
          ${field("Eyebrow", "articles.eyebrow", a.eyebrow)}
          ${field("Título (1)", "articles.title_pre", a.title_pre)}
          ${field("Título Destaque (2)", "articles.title_highlight", a.title_highlight)}
          <div class="mt-4">${items}</div>
          <button class="btn btn-ghost btn-sm btn-block mt-2" id="add-article">+ Adicionar Artigo</button>
        `;
      },
      lifestyle: () => {
        const l = content.lifestyle;
        const imgs = (l.images || []).map((img, i) => `
          <div class="ed-repeat">
            <div class="ed-repeat-head"><strong>Imagem ${i + 1}</strong> <button class="btn btn-ghost btn-sm" data-remove-lifestyle="${i}">Remover</button></div>
            ${imgField("Sua Foto", `lifestyle.images.${i}`, img)}
          </div>
        `).join("");
        return `
          <div class="block-label">Imagens de Estilo de Vida</div>
          ${field("Citação Inspiradora", "lifestyle.quote", l.quote)}
          <div class="mt-4">${imgs}</div>
          <button class="btn btn-ghost btn-sm btn-block mt-2" id="add-lifestyle">+ Adicionar Foto</button>
        `;
      },
      contact: () => {
        const c = content.contact;
        return `
          <div class="block-label">Rodapé & Contato</div>
          ${field("Frase de Fechamento", "contact.headline", c.headline)}
          ${field("Trecho Destaque da Frase", "contact.headline_highlight", c.headline_highlight)}
          ${field("Nome do Escritório (Rodapé)", "contact.team_name", c.team_name)}
          ${field("Número do WhatsApp", "contact.whatsapp_number", c.whatsapp_number, { ph: "5511999999999" })}
          ${field("Seu Instagram (Texto)", "contact.instagram", c.instagram, { ph: "@cirofreitas" })}
          ${field("Link do Instagram", "contact.instagram_url", c.instagram_url)}
          ${field("Seu Website (Texto)", "contact.website", c.website)}
          ${field("Link do Website", "contact.website_url", c.website_url)}
        `;
      }
    };

    let activeTab = "theme";
    function showTab(id) {
      activeTab = id;
      nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
      body.innerHTML = `<div class="ed-section active">${renderers[id]()}</div>`;
      attachHandlers();
    }

    function setPath(path, val) {
      const parts = path.split(".");
      let obj = content;
      for (let i = 0; i < parts.length - 1; i++) {
        if (!obj[parts[i]]) obj[parts[i]] = {};
        obj = obj[parts[i]];
      }
      obj[parts[parts.length - 1]] = val;
    }

    function attachHandlers() {
      // Basic text/number/textarea
      body.querySelectorAll("input.input, textarea.textarea").forEach(inp => {
        if (inp.type === "url" || inp.dataset.colorKey) return; // handled separately
        inp.addEventListener("input", (e) => {
          setPath(inp.dataset.key, inp.value);
          markDirty();
        });
      });
      // Checkboxes
      body.querySelectorAll("input[type='checkbox']").forEach(inp => {
        inp.addEventListener("change", (e) => {
          setPath(inp.dataset.key, inp.checked);
          markDirty();
        });
      });
      // Image upload widgets
      body.querySelectorAll("[data-upload-key]").forEach(lbl => {
        const fileInp = lbl.querySelector('input[type="file"]');
        fileInp.addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          if (file.size > 8 * 1024 * 1024) { toast("Imagem maior que 8 MB", "error"); fileInp.value = ""; return; }
          lbl.classList.add("uploading");
          try {
            const key = lbl.dataset.uploadKey;
            const url = await uploadSiteImage(file, session.user.id);
            setPath(key, url);
            markDirty(); toast("Enviada", "success");
            showTab(activeTab); // rerender to show thumb
          } catch (err) { console.error(err); toast("Falha", "error"); }
          finally { lbl.classList.remove("uploading"); fileInp.value = ""; }
        });
      });
      // Image clear
      body.querySelectorAll("[data-clear-key]").forEach(btn => {
        btn.addEventListener("click", () => {
          setPath(btn.dataset.clearKey, "");
          markDirty(); showTab(activeTab);
        });
      });
      // Image URL manual input
      body.querySelectorAll("input[type='url']").forEach(inp => {
        inp.addEventListener("input", (e) => {
          setPath(inp.dataset.key, inp.value);
          markDirty();
          const thumb = body.querySelector(`[data-thumb="${inp.dataset.key}"]`);
          if (thumb) thumb.innerHTML = inp.value ? `<img src="${esc(inp.value)}" alt=""/>` : "🖼";
        });
      });
      // Color pickers
      body.querySelectorAll("[data-color-key]").forEach(inp => {
        const key = inp.dataset.colorKey;
        const textInp = body.querySelector(`input[type="text"][data-key="${key}"]`);
        inp.addEventListener("input", () => {
          setPath(key, inp.value); textInp.value = inp.value; markDirty();
        });
        textInp.addEventListener("input", () => {
          setPath(key, textInp.value); inp.value = textInp.value; markDirty();
        });
      });
      // Reset colors
      const rstColors = body.querySelector("#reset-colors");
      if (rstColors) rstColors.addEventListener("click", () => {
        content.theme.colors = JSON.parse(JSON.stringify(BUFFET01_DEFAULTS.theme.colors));
        markDirty(); showTab("theme");
      });

      // Array adders
      const adder = (id, pushVal) => {
        const b = document.getElementById(id);
        if (b) b.addEventListener("click", () => { pushVal(); markDirty(); showTab(activeTab); });
      };
      adder("add-area", () => { content.areas.items ||= []; content.areas.items.push({ id:"", title:"Nova Área", desc:"", icon:"lucide-scale" }); });
      adder("add-marquee", () => { content.marquee.words ||= []; content.marquee.words.push({ text: "Nova palavra", italic: false }); });
      adder("add-about-p", () => { content.about.paragraphs ||= []; content.about.paragraphs.push(""); });
      adder("add-about-b", () => { content.about.bullets ||= []; content.about.bullets.push(""); });
      adder("add-article", () => { content.articles.items ||= []; content.articles.items.push({ title:"Novo Artigo", tag:"Tag", url:"", image_url:"" }); });
      adder("add-lifestyle", () => { content.lifestyle.images ||= []; content.lifestyle.images.push(""); });

      // Array removers
      const remover = (attr, pathFn) => {
        body.querySelectorAll(`[${attr}]`).forEach(btn => {
          btn.addEventListener("click", () => {
            const arr = pathFn();
            if (arr) { arr.splice(Number(btn.getAttribute(attr)), 1); markDirty(); showTab(activeTab); }
          });
        });
      };
      remover("data-remove-area", () => content.areas.items);
      remover("data-remove-marquee", () => content.marquee.words);
      remover("data-remove-about-p", () => content.about.paragraphs);
      remover("data-remove-about-b", () => content.about.bullets);
      remover("data-remove-article", () => content.articles.items);
      remover("data-remove-lifestyle", () => content.lifestyle.images);
    }

    showTab("theme");

    async function save() {
      const btn = document.getElementById("save-btn");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      const { error } = await supabase.from("sites").update({ content, published: true }).eq("user_id", session.user.id);
      btn.disabled = false; btn.textContent = "Salvar";
      if (error) { toast(error.message, "error"); return; }
      markClean(); toast("Salvo", "success");
    }
    document.getElementById("save-btn").addEventListener("click", save);
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); }
    });
    window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  </script>
</body>
</html>
