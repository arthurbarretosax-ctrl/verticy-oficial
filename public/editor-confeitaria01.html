<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/assets/img/logo-verticy.png" />
  <title>Editor Confeitaria Premium · Verticy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/verticy.css?v=3" />
  <style>
    .ed-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .ed-nav button { padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); color: var(--muted, #8892a6); font-size: 13px; cursor: pointer; transition: all .2s; }
    .ed-nav button.active { background: var(--brand, #7c5cff); border-color: transparent; color: #fff; }
    .ed-section { display: none; }
    .ed-section.active { display: block; }
    .ed-repeat { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: rgba(255,255,255,.02); }
    .ed-repeat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ed-repeat-head strong { font-size: 13px; }
    .textarea-sm { min-height: 70px; }

    /* Upload widget */
    .ed-img { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; margin-bottom: 14px; background: rgba(255,255,255,.02); }
    .ed-img-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .ed-img-head label { font-size: 13px; font-weight: 500; color: #cfd3df; }
    .ed-img-hint { font-size: 11px; color: var(--muted, #8892a6); letter-spacing: 0.02em; }
    .ed-img-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
    .ed-img-thumb { width: 96px; height: 96px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.3) center/cover no-repeat; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #4a4f5c; font-size: 22px; }
    .ed-img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ed-img-actions { display: flex; flex-direction: column; gap: 8px; }
    .ed-img-actions .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .ed-img input[type="file"] { display: none; }
    .ed-img .btn-file { position: relative; overflow: hidden; }
    .ed-img .btn-file.uploading { opacity: 0.6; pointer-events: none; }
    .ed-img .input-sm { padding: 8px 10px; font-size: 12px; }

    /* Color pickers */
    .ed-color { display: grid; grid-template-columns: 56px 1fr 110px; gap: 12px; align-items: center; padding: 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(255,255,255,.02); margin-bottom: 10px; }
    .ed-color input[type="color"] { width: 56px; height: 40px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: transparent; padding: 2px; cursor: pointer; }
    .ed-color .meta { display: flex; flex-direction: column; gap: 2px; }
    .ed-color .meta strong { font-size: 13px; color: #dfe3ec; font-weight: 500; }
    .ed-color .meta small { font-size: 11px; color: var(--muted, #8892a6); }
    .ed-color input[type="text"] { padding: 8px 10px; font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <div class="editor-shell">
    <header class="editor-toolbar">
      <a href="/painel.html" class="brand" style="font-size:15px"><span class="brand-mark"></span><span>Editor · Confeitaria Premium</span></a>
      <div class="flex gap-2 items-center">
        <span class="tag" id="save-state">Tudo salvo</span>
        <a class="btn btn-ghost btn-sm" id="preview-link" target="_blank" rel="noopener">Ver site</a>
        <button class="btn btn-primary btn-sm" id="save-btn">Salvar</button>
      </div>
    </header>

    <div class="editor-main">
      <aside class="editor-panel">
        <div class="ed-nav" id="ed-nav"></div>
        <div id="ed-body"></div>
      </aside>
      <main class="editor-preview">
        <div class="device-mockup">
          <div class="device-notch"></div>
          <iframe id="live-preview-frame" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { supabase, requireProfile, toast, uploadSiteImage } from "/assets/js/verticy.js";
    import { CONFEITARIA01_DEFAULTS } from "/assets/js/confeitaria01-defaults.js";

    const ctx = await requireProfile();
    if (!ctx) throw new Error("no session");
    const { session, profile } = ctx;
    if (!profile?.onboarding_completed) window.location.replace("/onboarding.html");

    document.getElementById("preview-link").href = `${window.location.origin}/${profile.username}`;
    const livePreviewFrame = document.getElementById("live-preview-frame");
    if (livePreviewFrame) livePreviewFrame.src = `${window.location.origin}/${profile.username}?preview=true`;

    const urlParams = new URLSearchParams(window.location.search);
    const siteIdParam = urlParams.get('site');
    let siteQuery = supabase.from("sites").select("*").eq("user_id", session.user.id);
    if (siteIdParam) {
      siteQuery = siteQuery.eq("id", siteIdParam).maybeSingle();
    } else {
      siteQuery = siteQuery.order("updated_at", { ascending: false }).limit(1).maybeSingle();
    }
    const { data: site } = await siteQuery;
    if (!site) { toast("Site não encontrado", "error"); throw new Error("no site"); }
    if (site.template_id !== "confeitaria01") {
      window.location.replace("/editor.html");
      throw new Error("wrong template");
    }

    function merge(base, add) {
      if (Array.isArray(base)) return add !== undefined ? add : base;
      if (typeof base === "object" && base !== null) {
        const out = { ...base };
        for (const k of Object.keys(base)) if (add && add[k] !== undefined) out[k] = merge(base[k], add[k]);
        if (add) for (const k of Object.keys(add)) if (!(k in base)) out[k] = add[k];
        return out;
      }
      return add !== undefined ? add : base;
    }
    let content = merge(CONFEITARIA01_DEFAULTS, site.content || {});

    const saveState = document.getElementById("save-state");
    let dirty = false;
    const markDirty = () => { 
      dirty = true; saveState.textContent = "Alterações pendentes"; saveState.className = "tag"; 
      if (livePreviewFrame && livePreviewFrame.contentWindow) {
        livePreviewFrame.contentWindow.postMessage({ type: "LIVE_PREVIEW", content }, "*");
      }
    };
    const markClean = () => { dirty = false; saveState.textContent = "Tudo salvo"; saveState.className = "tag success"; };

    const SECTIONS = [
      { id: "theme", label: "Cores" },
      { id: "branding", label: "Marca" },
      { id: "hero", label: "Capa (Hero)" },
      { id: "catalog", label: "Menu & Catálogo" },
      { id: "marquee", label: "Letreiro (Marquee)" },
      { id: "gallery", label: "Galeria (Vitrine)" },
      { id: "contact", label: "Contato & Rodapé" },
    ];

    const nav = document.getElementById("ed-nav");
    SECTIONS.forEach((s, i) => {
      const b = document.createElement("button");
      b.textContent = s.label;
      b.dataset.tab = s.id;
      if (i === 0) b.classList.add("active");
      b.addEventListener("click", () => showTab(s.id));
      nav.appendChild(b);
    });

    const body = document.getElementById("ed-body");
    function esc(s) { return String(s ?? "").replace(/"/g, "&quot;"); }
    function txt(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

    function field(label, key, val, opts = {}) {
      const t = opts.type || "text";
      if (t === "textarea") {
        return `<div class="field"><label>${label}</label><textarea class="textarea ${opts.small ? "textarea-sm" : ""}" data-key="${key}">${txt(val)}</textarea></div>`;
      }
      if (t === "checkbox") {
        return `<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-key="${key}" ${val ? "checked" : ""}/> ${label}</label></div>`;
      }
      return `<div class="field"><label>${label}</label><input class="input" type="${t}" data-key="${key}" value="${esc(val)}" placeholder="${esc(opts.ph||"")}" /></div>`;
    }

    function imgField(label, key, val, opts = {}) {
      const suggested = opts.suggested || "";
      const preview = val ? `<img src="${esc(val)}" alt=""/>` : "🖼";
      return `
        <div class="ed-img">
          <div class="ed-img-head">
            <label>${label}</label>
            ${suggested ? `<span class="ed-img-hint">Sugerido: ${esc(suggested)}</span>` : ""}
          </div>
          <div class="ed-img-row">
            <div class="ed-img-thumb" data-thumb="${key}">${preview}</div>
            <div class="ed-img-actions">
              <div class="row">
                <label class="btn btn-primary btn-sm btn-file" data-upload-key="${key}">
                  <input type="file" accept="image/*" />
                  Escolher do dispositivo
                </label>
                <button class="btn btn-ghost btn-sm" type="button" data-clear-key="${key}">Remover</button>
              </div>
              <input class="input input-sm" type="url" data-key="${key}" value="${esc(val)}" placeholder="ou cole uma URL" />
            </div>
          </div>
        </div>
      `;
    }

    function buildTab(id) {
      if (id === "theme") {
        const c = content.theme.colors;
        const cField = (lbl, key, hex, name) => `
          <div class="ed-color">
            <input type="color" data-key="theme.colors.${key}" value="${esc(hex)}" />
            <div class="meta"><strong>${lbl}</strong><small>${name}</small></div>
            <input type="text" value="${esc(hex)}" readonly />
          </div>`;
        return `
          <div class="ed-section active" data-sec="theme">
            <h2 class="h2">Paleta de Cores</h2>
            <p class="text-muted mb-6">Personalize os tons de rosé e bege da confeitaria.</p>
            ${cField("Fundo Principal", "bg", c.bg, "Fundo geral (claro)")}
            ${cField("Fundo dos Cartões", "card", c.card, "Fundo dos cartões e elementos")}
            ${cField("Texto Escuro", "text", c.text, "Texto principal")}
            ${cField("Cor de Destaque 1", "rose", c.rose, "Rosé, botões, ícones")}
            ${cField("Cor de Destaque 2", "roseDark", c.roseDark, "Rosé escuro para textos de destaque")}
            ${cField("Dourado", "gold", c.gold, "Pequenos detalhes de brilho")}
            <button class="btn btn-ghost btn-sm ed-color-reset" type="button" id="reset-colors">Restaurar Cores Originais</button>
          </div>
        `;
      }
      if (id === "branding") {
        const b = content.branding;
        return `
          <div class="ed-section active" data-sec="branding">
            <h2 class="h2">Marca</h2>
            ${imgField("Logo / Foto de Perfil", "branding.logo_url", b.logo_url, { suggested: "Redonda, fundo branco" })}
            ${field("Nome da Confeitaria", "branding.name", b.name)}
            ${field("Slogan (Curto)", "branding.slogan", b.slogan)}
            ${field("Localização", "branding.location", b.location, { ph: "Ex: Campos / RJ" })}
          </div>
        `;
      }
      if (id === "hero") {
        const h = content.hero;
        return `
          <div class="ed-section active" data-sec="hero">
            <h2 class="h2">Capa Principal</h2>
            ${imgField("Imagem de Fundo", "hero.image_url", h.image_url, { suggested: "Vertical, alta qualidade" })}
            ${field("Texto do Botão", "hero.cta_label", h.cta_label)}
          </div>
        `;
      }
      if (id === "marquee") {
        const words = content.marquee.words || [];
        return `
          <div class="ed-section active" data-sec="marquee">
            <h2 class="h2">Letreiro Rotativo</h2>
            <p class="text-muted mb-4">Adicione as palavras que giram na faixa.</p>
            <div id="mq-list"></div>
            <button class="btn btn-secondary btn-sm mt-2" type="button" id="add-mq">+ Adicionar Palavra</button>
          </div>
        `;
      }
      if (id === "catalog") {
        const c = content.catalog;
        return `
          <div class="ed-section active" data-sec="catalog">
            <h2 class="h2">Catálogo de Produtos</h2>
            ${field("Título da Seção", "catalog.title", c.title)}
            ${field("Subtítulo", "catalog.subtitle", c.subtitle)}
            <hr class="my-6" style="border-color:rgba(255,255,255,.1)"/>
            <div id="cat-items-list"></div>
            <button class="btn btn-secondary mt-2" type="button" id="add-cat-item">+ Novo Produto</button>
          </div>
        `;
      }
      if (id === "gallery") {
        const g = content.gallery;
        return `
          <div class="ed-section active" data-sec="gallery">
            <h2 class="h2">Galeria de Fotos</h2>
            ${field("Título da Galeria", "gallery.title", g.title)}
            ${field("Subtítulo", "gallery.subtitle", g.subtitle)}
            <hr class="my-6" style="border-color:rgba(255,255,255,.1)"/>
            <div id="gal-imgs-list"></div>
            <button class="btn btn-secondary mt-2" type="button" id="add-gal-img">+ Adicionar Foto</button>
          </div>
        `;
      }
      if (id === "contact") {
        const c = content.contact;
        return `
          <div class="ed-section active" data-sec="contact">
            <h2 class="h2">Contato e Rodapé</h2>
            ${field("Título do Rodapé", "contact.title_pre", c.title_pre)}
            ${field("Destaque (Cor diferente)", "contact.title_highlight", c.title_highlight)}
            ${field("Subtítulo de Contato", "contact.subtitle", c.subtitle)}
            <div class="field-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              ${field("Botão do WhatsApp", "contact.cta_label", c.cta_label)}
              ${field("Número do WhatsApp", "contact.whatsapp_number", c.whatsapp_number, { ph: "5522999999999" })}
            </div>
            <div class="field-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              ${field("Texto do Instagram", "contact.instagram_handle", c.instagram_handle, { ph: "@usuario" })}
              ${field("Link do Instagram", "contact.instagram_url", c.instagram_url, { ph: "https://..." })}
            </div>
            <hr class="my-6" style="border-color:rgba(255,255,255,.1)"/>
            ${field("Ano Copyright", "contact.footer_year", c.footer_year, { type: "number" })}
            ${field("Texto Copyright", "contact.footer_name", c.footer_name)}
          </div>
        `;
      }
      return "";
    }

    function renderMqList() {
      const container = document.getElementById("mq-list");
      if (!container) return;
      container.innerHTML = "";
      const words = content.marquee.words || [];
      words.forEach((w, i) => {
        const div = document.createElement("div");
        div.className = "ed-repeat";
        div.innerHTML = `
          <div class="ed-repeat-head"><strong>Palavra ${i+1}</strong> <button class="btn btn-ghost btn-sm del-mq" data-idx="${i}">Excluir</button></div>
          <div class="field-row" style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;">
            ${field("Texto", `marquee.words.${i}.text`, w.text)}
            ${field("Itálico?", `marquee.words.${i}.italic`, w.italic, { type: "checkbox" })}
          </div>
        `;
        container.appendChild(div);
      });
      container.querySelectorAll(".del-mq").forEach(b => b.addEventListener("click", e => {
        const i = parseInt(e.target.dataset.idx);
        content.marquee.words.splice(i, 1);
        markDirty();
        renderMqList();
      }));
    }

    function renderCatItems() {
      const container = document.getElementById("cat-items-list");
      if (!container) return;
      container.innerHTML = "";
      const items = content.catalog.items || [];
      items.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "ed-repeat";
        div.innerHTML = `
          <div class="ed-repeat-head"><strong>Produto ${i+1}</strong> <button class="btn btn-ghost btn-sm del-cat" data-idx="${i}">Excluir</button></div>
          ${imgField("Foto do Produto", `catalog.items.${i}.image_url`, item.image_url)}
          <div class="field-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            ${field("Nome", `catalog.items.${i}.title`, item.title)}
            ${field("Categoria (Badge)", `catalog.items.${i}.category`, item.category)}
          </div>
          ${field("Descrição", `catalog.items.${i}.description`, item.description, { type: "textarea", small: true })}
        `;
        container.appendChild(div);
      });
      container.querySelectorAll(".del-cat").forEach(b => b.addEventListener("click", e => {
        const i = parseInt(e.target.dataset.idx);
        content.catalog.items.splice(i, 1);
        markDirty();
        renderCatItems();
      }));
    }

    function renderGalImgs() {
      const container = document.getElementById("gal-imgs-list");
      if (!container) return;
      container.innerHTML = "";
      const images = content.gallery.images || [];
      images.forEach((src, i) => {
        const div = document.createElement("div");
        div.className = "ed-repeat";
        div.innerHTML = `
          <div class="ed-repeat-head"><strong>Imagem ${i+1}</strong> <button class="btn btn-ghost btn-sm del-gal" data-idx="${i}">Excluir</button></div>
          ${imgField("Foto", `gallery.images.${i}`, src)}
        `;
        container.appendChild(div);
      });
      container.querySelectorAll(".del-gal").forEach(b => b.addEventListener("click", e => {
        const i = parseInt(e.target.dataset.idx);
        content.gallery.images.splice(i, 1);
        markDirty();
        renderGalImgs();
      }));
    }

    function hookInputs(root) {
      root.querySelectorAll("input[data-key], textarea[data-key]").forEach(el => {
        el.addEventListener("input", e => {
          const key = e.target.dataset.key;
          let val = e.target.type === "checkbox" ? e.target.checked : e.target.value;
          if (e.target.type === "color") {
            const txt = e.target.parentElement.querySelector('input[type="text"]');
            if (txt) txt.value = val;
          }
          setPath(content, key, val);
          markDirty();
        });
      });

      root.querySelectorAll("input[type='url'][data-key]").forEach(el => {
        el.addEventListener("change", e => {
          const key = e.target.dataset.key;
          const thumb = root.querySelector(`.ed-img-thumb[data-thumb="${key}"]`);
          if (thumb) thumb.innerHTML = e.target.value ? `<img src="${esc(e.target.value)}" alt=""/>` : "🖼";
        });
      });

      root.querySelectorAll(".btn-file input[type='file']").forEach(input => {
        input.addEventListener("change", async e => {
          const file = e.target.files[0];
          if (!file) return;
          const label = e.target.closest("label");
          const key = label.dataset.uploadKey;
          try {
            label.classList.add("uploading");
            label.childNodes[2].textContent = " Enviando...";
            const url = await uploadSiteImage(session.user.id, profile.username, file);
            setPath(content, key, url);
            markDirty();
            
            const urlInput = root.querySelector(`input[data-key="${key}"]`);
            if (urlInput) {
              urlInput.value = url;
              urlInput.dispatchEvent(new Event("change"));
            }
          } catch (err) {
            console.error(err);
            toast("Erro no upload", "error");
          } finally {
            label.classList.remove("uploading");
            label.childNodes[2].textContent = " Escolher do dispositivo";
            e.target.value = "";
          }
        });
      });

      root.querySelectorAll("button[data-clear-key]").forEach(btn => {
        btn.addEventListener("click", e => {
          const key = e.target.dataset.clearKey;
          setPath(content, key, "");
          markDirty();
          const urlInput = root.querySelector(`input[data-key="${key}"]`);
          if (urlInput) {
            urlInput.value = "";
            urlInput.dispatchEvent(new Event("change"));
          }
        });
      });

      const resetColors = root.querySelector("#reset-colors");
      if (resetColors) {
        resetColors.addEventListener("click", () => {
          content.theme.colors = JSON.parse(JSON.stringify(CONFEITARIA01_DEFAULTS.theme.colors));
          markDirty();
          showTab("theme");
        });
      }

      const addMq = root.querySelector("#add-mq");
      if (addMq) {
        addMq.addEventListener("click", () => {
          if (!content.marquee) content.marquee = { words: [] };
          if (!content.marquee.words) content.marquee.words = [];
          content.marquee.words.push({ text: "Novo Texto", italic: false });
          markDirty();
          renderMqList();
          hookInputs(document.getElementById("mq-list"));
        });
      }

      const addCat = root.querySelector("#add-cat-item");
      if (addCat) {
        addCat.addEventListener("click", () => {
          if (!content.catalog) content.catalog = { items: [] };
          if (!content.catalog.items) content.catalog.items = [];
          content.catalog.items.push({
            id: "novo", title: "Novo Produto", description: "Descrição do produto", category: "Categoria", image_url: ""
          });
          markDirty();
          renderCatItems();
          hookInputs(document.getElementById("cat-items-list"));
        });
      }

      const addGal = root.querySelector("#add-gal-img");
      if (addGal) {
        addGal.addEventListener("click", () => {
          if (!content.gallery) content.gallery = { images: [] };
          if (!content.gallery.images) content.gallery.images = [];
          content.gallery.images.push("");
          markDirty();
          renderGalImgs();
          hookInputs(document.getElementById("gal-imgs-list"));
        });
      }
    }

    function setPath(obj, path, val) {
      const parts = path.split(".");
      let curr = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        if (!curr[parts[i]]) curr[parts[i]] = {};
        curr = curr[parts[i]];
      }
      curr[parts[parts.length - 1]] = val;
    }

    function showTab(id) {
      document.querySelectorAll(".ed-nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
      body.innerHTML = buildTab(id);
      hookInputs(body);
      if (id === "marquee") { renderMqList(); hookInputs(document.getElementById("mq-list")); }
      if (id === "catalog") { renderCatItems(); hookInputs(document.getElementById("cat-items-list")); }
      if (id === "gallery") { renderGalImgs(); hookInputs(document.getElementById("gal-imgs-list")); }
    }

    showTab("theme");

    document.getElementById("save-btn").addEventListener("click", async () => {
      try {
        const btn = document.getElementById("save-btn");
        btn.classList.add("loading");
        const { error } = await supabase.from("sites").update({ content, updated_at: new Date().toISOString() }).eq("id", site.id);
        if (error) throw error;
        markClean();
        toast("Site atualizado!");
      } catch (e) {
        console.error(e);
        toast("Erro ao salvar", "error");
      } finally {
        document.getElementById("save-btn").classList.remove("loading");
      }
    });

  </script>
</body>
</html>
