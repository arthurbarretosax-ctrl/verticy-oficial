<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/assets/img/logo-verticy.png?v=4" />
  <title>Meus Sites · Verticy</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=3" />
  <style>
    .settings-layout { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .settings-header { margin-bottom: 32px; }
    .settings-header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    .settings-header p { color: var(--text-muted); font-size: 15px; }
    
    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 24px;
    }
    .settings-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #fff; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
    .form-group input { 
      width: 100%; padding: 12px 16px; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-light);
      color: #fff; font-size: 15px; transition: all 0.2s;
    }
    .form-group input:focus { border-color: var(--brand-color); outline: none; background: rgba(255,255,255,0.05); }
    .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .plan-box {
      border: 1px solid var(--brand-color); background: rgba(124, 92, 255, 0.08);
      border-radius: var(--radius-md); padding: 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .plan-info h4 { color: var(--brand-color); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .plan-info p { color: var(--text-muted); font-size: 13px; }
    
    .btn-save { background: var(--brand-color); color: #fff; padding: 12px 24px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-save:hover { background: var(--brand-hover); }
    
    .fab-whatsapp {
      position: fixed; bottom: 32px; right: 32px; width: 60px; height: 60px;
      background: #25D366; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 32px; box-shadow: 0 10px 24px rgba(37, 211, 102, 0.4); transition: transform 0.2s; cursor: pointer; text-decoration: none;
      z-index: 100;
    }
    .fab-whatsapp:hover { transform: scale(1.05); color: #fff; }
  </style>
<script>if(localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');</script>
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo-container">
        <a href="/painel.html" style="display:flex; align-items:center;">
          <img src="assets/img/logo-verticy.png" alt="Verticy" style="height: 32px;" />
        </a>
        <div style="display: flex; gap: 12px; align-items: center;">
          <button id="theme-toggle-btn" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;">
            <i class="ph ph-moon"></i>
          </button>
          <button id="mobile-menu-btn" class="mobile-menu-btn" style="background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 24px; display: none;">
            <i class="ph ph-list"></i>
          </button>
        </div>
      </div>
      
      <nav class="nav-menu">
        <a href="/painel.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-house"></i><span>Painel</span></div>
        </a>
        <a href="agenda.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-calendar-blank"></i><span>Agenda</span></div>
          <span class="badge-new">Novo</span>
        </a>
        <a href="meus-sites.html" class="nav-item active">
          <div class="nav-item-left"><i class="ph ph-browser"></i><span>Meus Sites</span></div>
        </a>
        <a href="/templates.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-layout"></i><span>Templates</span></div>
        </a>
        <a href="dominios.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-globe"></i><span>Domínios</span></div>
        </a>
        <a href="analytics.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-chart-line-up"></i><span>Analytics</span></div>
          <span class="badge-new">Novo</span>
        </a>
        <a href="leads.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-users"></i><span>Leads</span></div>
          <span class="badge-new">Novo</span>
        </a>
        <a href="faturamento.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-credit-card"></i><span>Faturamento</span></div>
        </a>
        <a href="loja.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-shopping-bag"></i><span>Loja</span></div>
        </a>
        <a href="/configuracoes.html" class="nav-item">
          <div class="nav-item-left"><i class="ph ph-gear"></i><span>Configurações</span></div>
        </a>
              <a href="#" id="btn-logout" class="nav-item" style="margin-top: auto; color: #ef4444;">
          <div class="nav-item-left"><i class="ph ph-sign-out"></i><span>Sair</span></div>
        </a>
      </nav>

      <div class="user-profile" id="signout">
        <div class="user-profile-left">
          <div class="user-avatar" id="avatar">AB</div>
          <div class="user-details">
            <span class="user-name" id="profile-name">Carregando...</span>
            <span class="user-email" id="profile-email">...</span>
          </div>
        </div>
        <i class="ph ph-caret-down" style="color: var(--text-muted);"></i>
      </div>
    </aside>

    <main class="main-content" style="overflow-y: auto;">
      <div class="settings-layout" style="max-width: 1000px;">
        <div class="settings-header" style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h1>Meus Sites</h1>
            <p>Gerencie todos os seus microsites criados.</p>
          </div>
          <a href="/templates.html" class="btn btn-primary" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="ph ph-plus"></i> Novo Site
          </a>
        </div>
        
        <div id="sites-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;">
          <!-- Sites rendered via JS -->
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
            Carregando seus sites...
          </div>
        </div>
      </div>
    </main>
    
    <a href="https://wa.me/5522998256061" target="_blank" class="fab-whatsapp" title="Suporte via WhatsApp">
      <i class="ph ph-whatsapp-logo"></i>
    </a>
  </div>

  <script type="module">
    import { supabase, requireProfile, toast, initials, TEMPLATES } from "/assets/js/verticy.js";

    const ctx = await requireProfile();
    if (!ctx) throw new Error("no session");
    const { session, profile } = ctx;

    if (!profile?.onboarding_completed) { window.location.replace("/onboarding.html"); }

    const fullName = profile.full_name || "";
    document.getElementById("avatar").textContent = initials(fullName || "Você");
    document.getElementById("profile-name").textContent = fullName || "Você";
    document.getElementById("profile-email").textContent = session.user.email;

    async function loadSites() {
      const grid = document.getElementById("sites-grid");
      const { data: sites, error } = await supabase.from('sites').select('*').eq('user_id', session.user.id).order('updated_at', { ascending: false });
      
      if (error) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color: #ef4444;">Erro ao carregar sites: ${error.message}</div>`;
        return;
      }
      
      if (!sites || sites.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px dashed var(--border-light);">
            <i class="ph ph-browser" style="font-size: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
            <h3>Você ainda não tem nenhum site</h3>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Crie seu primeiro site escolhendo um template incrível.</p>
            <a href="/templates.html" class="btn btn-primary" style="text-decoration:none;">Ver Templates</a>
          </div>`;
        return;
      }
      
      grid.innerHTML = "";
      
      sites.forEach(site => {
        const tplId = site.template_id || "aurora";
        const tplInfo = TEMPLATES.find(t => t.id === tplId) || TEMPLATES[0];
        const statusClass = site.published ? "success" : "purple";
        const statusText = site.published ? "Publicado" : "Rascunho";
        
        const card = document.createElement("div");
        card.className = "settings-card";
        card.style.padding = "0";
        card.style.overflow = "hidden";
        card.style.display = "flex";
        card.style.flexDirection = "column";
        
        card.innerHTML = `
          <div style="height: 160px; overflow: hidden; position: relative;">
            <img src="${tplInfo.img}" style="width: 100%; height: 100%; object-fit: cover;" />
            <div style="position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px);">
              <span style="color: var(--status-${statusClass});">●</span> ${statusText}
            </div>
          </div>
          <div style="padding: 20px; flex-grow: 1;">
            <h3 style="margin-bottom: 4px; font-size: 18px;">${tplInfo.name}</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Atualizado em ${new Date(site.updated_at).toLocaleDateString("pt-BR")}</p>
            
            <div style="display: flex; gap: 8px;">
              <a href="/painel.html?site=${site.id}" class="btn" style="flex: 1; background: rgba(255,255,255,0.05); text-align: center; text-decoration: none; border-radius: 6px; font-size: 14px;">Painel</a>
            </div>
            
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <button onclick="window.duplicateSite('${site.id}')" class="btn" style="flex: 1; background: transparent; border: 1px solid var(--border-light); color: var(--text-main); border-radius: 6px; font-size: 13px;">
                <i class="ph ph-copy"></i> Duplicar
              </button>
              <button onclick="window.deleteSite('${site.id}')" class="btn" style="flex: 1; background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; border-radius: 6px; font-size: 13px;">
                <i class="ph ph-trash"></i> Excluir
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    loadSites();

    window.duplicateSite = async (id) => {
      if(!confirm("Deseja criar uma cópia deste site?")) return;
      
      const { data: original } = await supabase.from('sites').select('*').eq('id', id).single();
      if(!original) return;
      
      const { id: _, created_at, updated_at, ...copyData } = original;
      copyData.published = false;
      
      toast("Duplicando...", "info");
      const { error } = await supabase.from('sites').insert(copyData);
      
      if(error) {
        toast("Erro ao duplicar: " + error.message, "error");
      } else {
        toast("Site duplicado com sucesso!", "success");
        loadSites();
      }
    };

    window.deleteSite = async (id) => {
      if(!confirm("Tem certeza que deseja excluir este site? Esta ação não pode ser desfeita.")) return;
      
      const { error } = await supabase.from('sites').delete().eq('id', id);
      
      if(error) {
        toast("Erro ao excluir: " + error.message, "error");
      } else {
        toast("Site excluído com sucesso!", "success");
        loadSites();
      }
    };


  </script>
<script type="module">
  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navMenu = document.querySelector('.nav-menu');
  if(mobileMenuBtn && navMenu) {
    mobileMenuBtn.addEventListener('click', () => {
      navMenu.classList.toggle('open');
      const icon = mobileMenuBtn.querySelector('i');
      if(navMenu.classList.contains('open')) {
        icon.className = 'ph ph-x';
      } else {
        icon.className = 'ph ph-list';
      }
    });
  }

  // Theme Toggle
  const themeToggleBtn = document.getElementById('theme-toggle-btn');
  if(themeToggleBtn) {
    const updateIcon = () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      themeToggleBtn.innerHTML = isLight ? '<i class="ph ph-sun"></i>' : '<i class="ph ph-moon"></i>';
    };
    updateIcon();
    themeToggleBtn.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if(isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
      updateIcon();
    });
  }

  // Logout
  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) {
    btnLogout.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const module = await import('/assets/js/verticy.js');
        await module.supabase.auth.signOut();
      } catch (err) { console.error(err); }
      window.location.href = '/entrar.html';
    });
  }
</script>
</body>
</html>
