<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídia Kit</title>
  
  <!-- OTIMIZAÇÃO: Pré-carregar a imagem principal para aparecer imediatamente -->
  <link rel="preload" as="image" href="sandi1.png" fetchpriority="high">

  <!-- Importando o Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Importando os Ícones (Lucide) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos Customizados & Animações -->
  <style>
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    .animate-float-delayed {
      animation: float 6s ease-in-out 3s infinite;
    }

    .reveal {
      opacity: 0;
      transform: translateY(3rem);
      transition: all 1.2s cubic-bezier(0.5, 0, 0, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-hero {
      opacity: 0;
      transform: scale(0.95) translateY(1rem);
      transition: all 1s cubic-bezier(0.5, 0, 0, 1);
    }
    .reveal-hero.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-[#e5e7eb] font-sans overflow-x-hidden pb-10 min-h-screen">

  <!-- DADOS INVISÍVEIS PARA O JAVASCRIPT LER APÓS O INJECT DO VERTICY -->
  <div style="display:none;" id="dyn-telefone" data-bind="config.telefone"></div>
  <div style="display:none;" id="dyn-email" data-bind="config.email"></div>
  <div style="display:none;" id="dyn-msg-geral" data-bind="config.msg_geral"></div>
  <div style="display:none;" id="dyn-msg-servico" data-bind="config.msg_servico"></div>

  <div class="max-w-md mx-auto bg-[#0a0a0a] min-h-screen relative shadow-2xl overflow-hidden sm:border-x sm:border-[#262626]">
    
    <div class="absolute top-0 right-0 w-80 h-80 bg-[#d6bc97] rounded-full mix-blend-overlay filter blur-[100px] opacity-20 -translate-y-1/4 translate-x-1/4 pointer-events-none animate-float"></div>
    <div class="absolute top-[20%] left-0 w-64 h-64 bg-[#ffffff] rounded-full mix-blend-overlay filter blur-[100px] opacity-10 -translate-x-1/2 pointer-events-none animate-float-delayed"></div>

    <!-- --- PAGE 1: CAPA --- -->
    <section class="relative z-10 fade-in-start">
      <div class="h-[34rem] w-full relative rounded-b-[3rem] overflow-hidden shadow-lg border-b border-[#262626]">
        
        <!-- FOTO 1: CAPA -->
        <img data-bind="hero.bg_image" src="" alt="Capa" class="w-full h-full object-cover object-top filter contrast-125 saturate-110" loading="eager" fetchpriority="high" decoding="sync" />
        
        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/50 to-transparent flex flex-col justify-end p-8 pb-12 text-center">
          <h2 class="text-[#d6bc97] font-medium tracking-widest mb-2 flex items-center justify-center gap-2 uppercase text-[10px]">
            <i data-lucide="sparkles" class="w-3 h-3"></i> <span data-bind="hero.name"></span>
          </h2>
          <!-- ALTERAÇÃO: Removido o espaço (gap-2) entre PORT e FÓLIO -->
          <div class="flex justify-center">
            <h1 class="text-5xl font-black tracking-tight text-white drop-shadow-md" data-bind="hero.title1"></h1>
            <h1 class="text-5xl font-black tracking-tighter text-[#d6bc97] drop-shadow-md" data-bind="hero.title2"></h1>
          </div>
          <p class="text-white/70 text-[10px] mt-3 font-medium tracking-[0.3em] uppercase" data-bind="hero.subtitle"></p>
        </div>
        
        <svg class="absolute pointer-events-none top-10 left-5 text-[#d6bc97]/30 animate-float-delayed" width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 10V40M15 25H45" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M100 30V60M85 45H115" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M50 80V110M35 95H65" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M120 90V120M105 105H135" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </section>

    <!-- --- PAGE 2: BIOGRAFIA & POLAROIDS --- -->
    <section class="px-6 py-12 relative z-10">
      <div class="flex items-center justify-center gap-2 mb-8">
         <a data-bind="about.instagram_link" href="#" target="_blank" class="bg-[#171717] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-black px-5 py-2 uppercase tracking-[0.2em] rounded-full flex items-center gap-2 hover:bg-[#d6bc97] hover:text-[#0a0a0a] transition-all shadow-sm cursor-pointer">
           <i data-lucide="instagram" class="w-4 h-4"></i>
           <span data-bind="about.instagram"></span>
         </a>
      </div>

      <div class="relative h-[22rem] w-full mb-8">
        <!-- FOTO 2: POLAROID ESQUERDA -->
        <div class="absolute top-0 left-0 w-40 transform -rotate-6 z-10 shadow-2xl bg-[#1c1c1c] p-2 pb-8 hover:rotate-0 hover:z-40 transition-all duration-300 border border-[#262626]">
          <img data-bind="about.polaroid1" src="" alt="Polaroid" class="w-full h-40 object-cover opacity-90 hover:opacity-100 transition-opacity" loading="lazy" decoding="async" />
        </div>
        
        <!-- FOTO 3: POLAROID DIREITA -->
        <div class="absolute top-4 right-0 w-44 transform rotate-6 z-20 shadow-2xl bg-[#1c1c1c] p-2 pb-8 hover:rotate-0 hover:z-40 transition-all duration-300 border border-[#262626]">
          <img data-bind="about.polaroid2" src="" alt="Polaroid" class="w-full h-48 object-cover opacity-90 hover:opacity-100 transition-opacity" loading="lazy" decoding="async" />
        </div>
        
        <!-- FOTO 4: POLAROID CENTRAL -->
        <div class="absolute top-36 left-12 w-48 transform -rotate-2 z-30 shadow-[0_20px_50px_rgba(0,0,0,0.5)] bg-[#1c1c1c] p-2 pb-10 hover:scale-105 transition-all duration-300 border-b-4 border-[#d6bc97] border-x border-t border-x-[#262626] border-t-[#262626]">
          <img data-bind="about.polaroid3" src="" alt="Polaroid" class="w-full h-52 object-cover" loading="lazy" decoding="async" />
        </div>
      </div>

      <div class="bg-[#171717]/80 backdrop-blur-md p-8 rounded-3xl border border-[#262626] shadow-xl">
        <h2 class="text-2xl font-black tracking-widest text-white mb-6 uppercase text-center" data-bind="about.title"></h2>
        
        <!-- PARÁGRAFO 1 -->
        <p class="text-[#a3a3a3] text-[13px] leading-relaxed">
          <span data-bind="about.p1_pt1"></span><strong class="text-[#d6bc97] font-semibold" data-bind="about.p1_highlight"></strong><span data-bind="about.p1_pt2"></span>
        </p>
        
        <!-- FOTO 5: MINI SANDI CRIANÇA COM CONTEXTO -->
        <div class="w-full flex flex-col items-center my-8 relative">
          <img data-bind="about.mini_img" src="" alt="Mini Sandi" class="w-56 h-48 object-cover object-center rounded-2xl border border-[#d6bc97]/30 shadow-xl" loading="lazy" decoding="async" />
          <div class="absolute -bottom-3 bg-[#171717] border border-[#d6bc97]/50 px-4 py-1.5 rounded-full shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
             <p class="text-[#d6bc97] text-[9px] font-black uppercase tracking-[0.2em] flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3 h-3"></i> <span data-bind="about.mini_label"></span></p>
          </div>
        </div>

        <!-- PARÁGRAFO 2 -->
        <p class="text-[#a3a3a3] text-[13px] leading-relaxed mt-4" data-bind="about.p2"></p>
      </div>
    </section>

    <!-- --- PAGE 3: NAS REDES SOCIAIS --- -->
    <section class="px-6 py-12 relative z-10 bg-[#171717] rounded-[3rem] mx-2 shadow-2xl text-white text-center overflow-hidden border border-[#262626]">
      <svg class="absolute pointer-events-none bottom-0 left-0 text-[#d6bc97]/5 animate-float" width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 10V40M15 25H45" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M100 30V60M85 45H115" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M50 80V110M35 95H65" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M120 90V120M105 105H135" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>

      <div class="mb-10 relative z-10">
        <h2 class="text-4xl font-black leading-none tracking-tight" data-bind="social.title1"></h2>
        <h2 class="text-4xl font-black text-[#d6bc97] leading-none tracking-tight" data-bind="social.title2"></h2>
      </div>

      <div class="grid grid-cols-2 gap-y-8 gap-x-4 relative z-10">
        <div class="bg-[#0a0a0a]/50 p-4 rounded-2xl border border-[#262626]">
          <p class="text-[9px] font-bold uppercase tracking-widest text-[#a3a3a3] mb-1" data-bind="social.stat1_label"></p>
          <p class="text-4xl font-black text-white" data-bind="social.stat1_value"></p>
        </div>
        <div class="bg-[#0a0a0a]/50 p-4 rounded-2xl border border-[#262626]">
          <p class="text-[9px] font-bold uppercase tracking-widest text-[#a3a3a3] mb-1" data-bind="social.stat2_label"></p>
          <p class="text-4xl font-black text-white" data-bind="social.stat2_value"></p>
        </div>
        <div class="bg-[#0a0a0a]/50 p-4 rounded-2xl border border-[#262626]">
          <p class="text-[9px] font-bold uppercase tracking-widest text-[#a3a3a3] mb-1" data-bind="social.stat3_label"></p>
          <p class="text-4xl font-black text-white"><span data-bind="social.stat3_value1"></span><span class="text-xl text-[#d6bc97]" data-bind="social.stat3_value2"></span></p>
        </div>
        <div class="bg-[#d6bc97] p-4 rounded-2xl shadow-[0_0_30px_rgba(214,188,151,0.2)] transform scale-105">
          <p class="text-[9px] font-bold uppercase tracking-widest text-[#0a0a0a]/70 mb-1" data-bind="social.stat4_label"></p>
          <p class="text-4xl font-black text-[#0a0a0a]"><span data-bind="social.stat4_value1"></span><span class="text-xl text-[#171717]" data-bind="social.stat4_value2"></span></p>
        </div>
      </div>
    </section>

    <!-- --- PAGE 4: MEDIDAS --- -->
    <section class="px-8 py-16 relative z-10">
      <div class="flex items-center justify-between mb-10 border-b border-[#262626] pb-4">
        <h2 class="text-3xl font-black text-white uppercase tracking-tighter leading-none" data-bind="measures.title">
        </h2>
        <i data-lucide="ruler" class="w-6 h-6 text-[#d6bc97]"></i>
      </div>

      <div class="flex gap-2 items-center">
        <!-- Coluna de Texto -->
        <div class="w-[45%] flex flex-col justify-center space-y-4">
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item1_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item1_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item2_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item2_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item3_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item3_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item4_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item4_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item5_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item5_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item6_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item6_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item7_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item7_value"></span>
           </div>
           <div class="flex justify-between text-[10px] sm:text-[11px] tracking-widest">
             <span class="text-[#a3a3a3] uppercase underline decoration-[#262626] underline-offset-4" data-bind="measures.item8_label"></span> 
             <span class="text-white font-medium" data-bind="measures.item8_value"></span>
           </div>
        </div>

        <!-- Coluna de Imagens -->
        <div class="w-[55%] relative h-72 flex items-center justify-end">
           <!-- FOTO 6 -->
           <img data-bind="measures.img1" src="" alt="Look Verde 1" class="absolute top-2 right-2 w-32 h-44 object-cover object-top rounded-xl shadow-lg z-10 border border-[#262626]" loading="lazy" decoding="async">
           
           <!-- FOTO 7 -->
           <img data-bind="measures.img2" src="" alt="Look Verde 2" class="absolute bottom-2 right-12 w-32 h-44 object-cover object-top rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] z-20 border border-[#d6bc97]/30" loading="lazy" decoding="async">
        </div>
      </div>
    </section>

    <!-- --- PAGE 5: SERVIÇOS --- -->
    <section class="py-16 relative z-10 bg-[#121212] rounded-t-[3rem] border-t border-[#262626]">
      
      <div class="px-6 mb-10 text-center">
        <!-- ALTERAÇÃO: Trabalhos -> Parcerias e serviços -->
        <span class="bg-[#d6bc97] text-[#0a0a0a] text-[9px] font-black px-4 py-1.5 uppercase tracking-[0.3em] rounded-full mb-4 inline-block" data-bind="services.badge"></span>
        <!-- ALTERAÇÃO: PORTFÓLIO CRIATIVO -> trabalhe comigo! -->
        <h2 class="text-3xl font-black text-white leading-tight tracking-tight uppercase">
          <span data-bind="services.title1"></span><br/><span class="text-[#d6bc97]" data-bind="services.title2"></span>
        </h2>
      </div>

      <!-- Galeria de Serviços -->
      <div class="flex overflow-x-auto pb-8 px-6 gap-5 hide-scrollbar snap-x">
        
        <!-- FOTO 8 -->
        <div onclick="handleWhatsAppClick(this)" class="snap-center shrink-0 w-[17rem] bg-[#1c1c1c] rounded-[2rem] shadow-xl overflow-hidden cursor-pointer group transform transition-transform hover:-translate-y-2 border border-[#262626]">
          <div class="h-72 w-full overflow-hidden relative">
            <img data-bind="services.card1_img" src="" alt="Ensaio em Estúdio" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" loading="lazy" decoding="async" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#1c1c1c] to-transparent opacity-80"></div>
          </div>
          <div class="p-6 text-center relative -mt-10">
            <h3 class="js-service-title font-black text-white text-lg mb-4 drop-shadow-md" data-bind="services.card1_title"></h3>
            <button class="w-full bg-[#262626] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-bold py-3.5 uppercase tracking-[0.2em] rounded-xl group-hover:bg-[#d6bc97] group-hover:text-[#0a0a0a] transition-colors" data-bind="services.card1_btn"></button>
          </div>
        </div>

        <!-- FOTO 9 -->
        <div onclick="handleWhatsAppClick(this)" class="snap-center shrink-0 w-[17rem] bg-[#1c1c1c] rounded-[2rem] shadow-xl overflow-hidden cursor-pointer group transform transition-transform hover:-translate-y-2 border border-[#262626]">
          <div class="h-72 w-full overflow-hidden relative">
            <img data-bind="services.card2_img" src="" alt="Lookbook" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" loading="lazy" decoding="async" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#1c1c1c] to-transparent opacity-80"></div>
          </div>
          <div class="p-6 text-center relative -mt-10">
            <h3 class="js-service-title font-black text-white text-lg mb-4 drop-shadow-md" data-bind="services.card2_title"></h3>
            <button class="w-full bg-[#262626] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-bold py-3.5 uppercase tracking-[0.2em] rounded-xl group-hover:bg-[#d6bc97] group-hover:text-[#0a0a0a] transition-colors" data-bind="services.card2_btn"></button>
          </div>
        </div>

        <!-- SERVIÇO: MODELO DE PASSARELA (ALTERADO PARA 1 FOTO) -->
        <div onclick="handleWhatsAppClick(this)" class="snap-center shrink-0 w-[17rem] bg-[#1c1c1c] rounded-[2rem] shadow-xl overflow-hidden cursor-pointer group transform transition-transform hover:-translate-y-2 border border-[#262626]">
          <div class="h-72 w-full overflow-hidden relative">
            <img data-bind="services.card3_img" src="" alt="Modelo de Passarela" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" loading="lazy" decoding="async" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#1c1c1c] to-transparent opacity-80"></div>
          </div>
          <div class="p-6 text-center relative -mt-10">
            <h3 class="js-service-title font-black text-white text-lg mb-4 drop-shadow-md" data-bind="services.card3_title"></h3>
            <button class="w-full bg-[#262626] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-bold py-3.5 uppercase tracking-[0.2em] rounded-xl group-hover:bg-[#d6bc97] group-hover:text-[#0a0a0a] transition-colors" data-bind="services.card3_btn"></button>
          </div>
        </div>

        <!-- FOTO 10 -->
        <div onclick="handleWhatsAppClick(this)" class="snap-center shrink-0 w-[17rem] bg-[#1c1c1c] rounded-[2rem] shadow-xl overflow-hidden cursor-pointer group transform transition-transform hover:-translate-y-2 border border-[#262626]">
          <div class="h-72 w-full overflow-hidden relative">
            <img data-bind="services.card4_img" src="" alt="Conteúdo UGC" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" loading="lazy" decoding="async" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#1c1c1c] to-transparent opacity-80"></div>
          </div>
          <div class="p-6 text-center relative -mt-10">
            <h3 class="js-service-title font-black text-white text-lg mb-4 drop-shadow-md" data-bind="services.card4_title"></h3>
            <button class="w-full bg-[#262626] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-bold py-3.5 uppercase tracking-[0.2em] rounded-xl group-hover:bg-[#d6bc97] group-hover:text-[#0a0a0a] transition-colors" data-bind="services.card4_btn"></button>
          </div>
        </div>

        <!-- FOTO 11 -->
        <div onclick="handleWhatsAppClick(this)" class="snap-center shrink-0 w-[17rem] bg-[#1c1c1c] rounded-[2rem] shadow-xl overflow-hidden cursor-pointer group transform transition-transform hover:-translate-y-2 border border-[#262626]">
          <div class="h-72 w-full overflow-hidden relative">
            <img data-bind="services.card5_img" src="" alt="Parcerias" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" loading="lazy" decoding="async" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#1c1c1c] to-transparent opacity-80"></div>
          </div>
          <div class="p-6 text-center relative -mt-10">
            <h3 class="js-service-title font-black text-white text-lg mb-4 drop-shadow-md" data-bind="services.card5_title"></h3>
            <button class="w-full bg-[#262626] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-bold py-3.5 uppercase tracking-[0.2em] rounded-xl group-hover:bg-[#d6bc97] group-hover:text-[#0a0a0a] transition-colors" data-bind="services.card5_btn"></button>
          </div>
        </div>

        <!-- FOTO 12 -->
        <div onclick="handleWhatsAppClick(this)" class="snap-center shrink-0 w-[17rem] bg-[#1c1c1c] rounded-[2rem] shadow-xl overflow-hidden cursor-pointer group transform transition-transform hover:-translate-y-2 border border-[#262626]">
          <div class="h-72 w-full overflow-hidden relative">
            <img data-bind="services.card6_img" src="" alt="Captação externa" class="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" loading="lazy" decoding="async" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#1c1c1c] to-transparent opacity-80"></div>
          </div>
          <div class="p-6 text-center relative -mt-10">
            <h3 class="font-black text-white text-lg mb-4 drop-shadow-md leading-tight">
              <span class="js-service-title" data-bind="services.card6_title"></span><br>
              <span class="text-sm font-normal" data-bind="services.card6_title2"></span>
            </h3>
            <button class="w-full bg-[#262626] border border-[#d6bc97]/30 text-[#d6bc97] text-[10px] font-bold py-3.5 uppercase tracking-[0.2em] rounded-xl group-hover:bg-[#d6bc97] group-hover:text-[#0a0a0a] transition-colors mt-2" data-bind="services.card6_btn"></button>
          </div>
        </div>

      </div>
    </section>

    <!-- --- MOODBOARD --- -->
    <section class="px-6 py-16 relative z-10 bg-[#121212]">
      <div class="text-center mb-10">

386:   <script>
387:     // Lógica para executar DEPOIS que o Verticy injetar os dados (DOMContentLoaded)
388:     // Como o Verticy injeta no DOMContentLoaded, usamos MutationObserver ou requestAnimationFrame
389:     // para garantir que pegamos os dados dinâmicos das divs ocultas.
390:     let dynTelefone = "554792880402";
391:     let dynEmail = "sandiele.emili@gmail.com";
392:     let dynMsgGeral = "Olá Sandi! Acessei o seu Portfólio e gostaria de conversar sobre uma parceria.";
393:     let dynMsgServico = "Olá Sandi! Acessei o seu Portfólio. Achei incrível e gostaria de solicitar um orçamento para o formato de *{servico}*.";
394: 
395:     function initDynamicData() {
396:       const elTel = document.getElementById('dyn-telefone');
397:       if(elTel && elTel.textContent) dynTelefone = elTel.textContent;
398:       
399:       const elEmail = document.getElementById('dyn-email');
400:       if(elEmail && elEmail.textContent) dynEmail = elEmail.textContent;
401: 
402:       const elMsg = document.getElementById('dyn-msg-geral');
403:       if(elMsg && elMsg.textContent) dynMsgGeral = elMsg.textContent;
404: 
405:       const elMsgS = document.getElementById('dyn-msg-servico');
406:       if(elMsgS && elMsgS.textContent) dynMsgServico = elMsgS.textContent;
407:     }
408: 
409:     document.addEventListener("DOMContentLoaded", () => {
410:       // Espera alguns milissegundos para o Verticy terminar o inject
411:       setTimeout(() => {
412:         lucide.createIcons();
413:         initDynamicData();
414: 
415:         const capa = document.querySelector('.fade-in-start');
416:         if (capa) {
417:           capa.classList.add('reveal-hero');
418:           requestAnimationFrame(() => {
419:             setTimeout(() => {
420:               capa.classList.add('active');
421:             }, 100); 
422:           });
423:         }
424: 
425:         const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
426:         const observer = new IntersectionObserver((entries, obs) => {
427:           entries.forEach(entry => {
428:             if (entry.isIntersecting) {
429:               entry.target.classList.add('active');
430:               obs.unobserve(entry.target); 
431:             }
432:           });
433:         }, observerOptions);
434: 
435:         const sections = document.querySelectorAll('section:not(.fade-in-start)');
436:         sections.forEach((sec) => {
437:           sec.classList.add('reveal');
438:           observer.observe(sec);
439:         });
440:       }, 100);
441:     });
442: 
443:     function handleWhatsAppClick(btnElement) {
444:       initDynamicData(); // Atualiza caso mude dinamicamente
445:       let text = dynMsgGeral;
446:       
447:       // Se o clique veio de um card de serviço, btnElement é o botão clicado
448:       if (btnElement) {
449:         const titleEl = btnElement.querySelector('.js-service-title');
450:         if (titleEl) {
451:           const serviceName = titleEl.textContent.trim();
452:           if (serviceName) {
453:             text = dynMsgServico.replace('{servico}', serviceName);
454:           }
455:         }
456:       }
457:       
458:       const url = `https://wa.me/${dynTelefone}?text=${encodeURIComponent(text)}`;
459:       window.open(url, '_blank');
460:     }
461: 
462:     function handleEmailClick() {
463:       initDynamicData();
464:       window.open(`mailto:${dynEmail}`, '_blank');
465:     }
466:   </script>
